<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избор на форма</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Same design tokens as lessonsCenter.html, so this hub and every
           tool it links to read as one app, not a stitched-together set of
           separately-styled pages. */
        :root{
            --ink:#1B3A5C;
            --ink-soft:#5C7189;
            --ink-faint:#9AA8B5;
            --chalk:#F7F2E7;
            --paper:#FFFFFF;
            --indigo:#8B85F5;
            --indigo-dark:#6259D1;
            --indigo-soft:#EFEDFC;
            --border:#EAE2D2;
            --border-soft:#F1EBDE;
            --border-section: color-mix(in srgb, var(--border) 40%, var(--ink-faint));
            --radius-lg:18px;
            --radius-md:13px;
            --radius-sm:8px;
            --shadow-sm:0 1px 2px rgba(27,58,92,0.045);
            --shadow-md:0 8px 22px -8px rgba(27,58,92,0.10);
            --shadow-lg:0 22px 48px -14px rgba(27,58,92,0.16);
            --font-display:'Plus Jakarta Sans', sans-serif;
            --font-body:'Inter', sans-serif;
        }
        *, *::before, *::after{ box-sizing: border-box; }
        :focus-visible{
            outline: 2.5px solid var(--indigo-dark);
            outline-offset: 2px;
            border-radius: 6px;
        }
        body {
            font-family: var(--font-body);
            color: var(--ink);
            background: var(--chalk);
            text-align: center;
            padding: 50px 20px;
            margin: 0;
            min-height: 100vh;
        }

        .hub-shell {
            max-width: 620px;
            margin: 0 auto;
            background: var(--paper);
            border: 1px solid var(--border-section);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            padding: 40px 32px;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin: 0 0 30px;
        }

        .link-container {
            display: block;
            justify-content: center;
            gap: 40px;
        }

        a {
            padding: 12px 20px;
            min-width: 160px;
            text-align: center;
            background-color: var(--indigo-soft);
            border-radius: var(--radius-md);
            text-decoration: none;
            color: var(--indigo-dark);
            font-weight: 600;
            font-family: var(--font-body);
            border: 1px solid var(--indigo);
            transition: background-color .15s ease, box-shadow .15s ease, transform .1s ease;
        }

        a:hover {
            background-color: var(--indigo);
            color: var(--paper);
            box-shadow: var(--shadow-sm);
        }
        a:active { transform: translateY(1px); }
        .link-container .row {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px 0; /* разстояние над и под всеки ред */
        }
        .toggle-btn {
            border: 1px solid var(--border-section);
            background: var(--chalk);
            color: var(--ink-soft);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            line-height: 38px;
            transition: background-color .15s ease, border-color .15s ease;
        }
        .toggle-btn:hover { background: var(--indigo-soft); border-color: var(--indigo); color: var(--indigo-dark); }
        /* Ensure hidden rows actually override flex display */
        .row.hidden { display: none !important; }

        @media (max-width: 480px) {
            .hub-shell { padding: 28px 20px; }
            a { min-width: 0; flex: 1 1 140px; }
        }
    </style>
</head>
    <body>
      <div class="hub-shell">
        <h1>Избери форма</h1>

        <div class="link-container">
           <!-- Първи ред (3 бутона) -->
            <div class="row">
                <a href="lessonsCalendar.html">График</a>
                <a href="lessonsCenter.html">Уроци</a>
                <a href="lessonsLibraryUpdated.html">Библиотека</a>
            </div>

            <!-- Втори ред (3 бутона) -->
            <div class="row">
                <a href="exe_solutions.html">Качване на задачи</a>
                <a href="versionControl.html">VC</a>
                <a href="whatHaveILearned.html">Активност</a>
            </div>  

             <!-- Трети ред (2 бутона) -->
            <div class="row">
                <!-- <a href="activity-form.html">Активност</a> -->
                <a href="theoremsCenter.html">Теореми</a>
                <a href=""">...</a>
            </div>

            <div class="row">
                <button id="toggleAdvancedBtn" class="toggle-btn" title="Още">+</button>
            </div>
            <!-- Четвърти ред (2 бутона, hidden/toggle) -->
            <div id="advancedRow" class="row hidden" aria-hidden="true">
                <!-- генератор с по-малко опции и функционалности <a href="yearPlanner.html">Генератор Програма</a> -->
                <a href="./schedule/html/terms.html">Генератор програма</a>
                <a href="schedule_form.html">Съб-Генератор Програма</a>
            </div>
            <div class="row">
             <!-- преместено в exe_solutions.html - manage records :    <a href="./exe_center_visualizer.html">В разработка</a> -->

            </div>
        </div>
      </div>
</body>
        <script>
          (function(){
            const btn = document.getElementById('toggleAdvancedBtn');
            const adv = document.getElementById('advancedRow');
            if(btn && adv){
              btn.addEventListener('click', ()=>{
                const isHidden = adv.classList.toggle('hidden');
                adv.setAttribute('aria-hidden', isHidden ? 'true' : 'false');
                btn.textContent = isHidden ? '+' : '−';
              });
            }
          })();
        </script>
</html>
