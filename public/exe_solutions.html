<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>File Upload Panel</title>
    <link rel="stylesheet" href="styles.css" />
<style>
.ysn-root { right:auto !important; left:16px !important; }
.ysn-root .ysn-panel{ left:0 !important; right:auto !important; }
  * { box-sizing: border-box; }
    body {
    background-color: #f4f6f8;
    color: #1f2937;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
}

   input[type="text"], input[type="number"], input[type="date"],
    select, textarea {
        width: 100%;
        padding: 8px 10px;
        font-size: 14px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        background-color: #fff;
        color: #1f2937;
        margin-top: 6px;
    }
    input[type="text"]:focus, input[type="number"]:focus, input[type="date"]:focus,
    select:focus, textarea:focus {
        outline: none;
        border-color: #111827;
        box-shadow: 0 0 0 3px rgba(17,24,39,0.08);
    }

   select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        padding-right: 34px;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='none' stroke='%23374151' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 8l4 4 4-4'/></svg>");
        background-repeat: no-repeat;
        background-position: right 10px center;
        background-size: 14px;
        cursor: pointer;
    }

  input[type="file"] {
        font-size: 13px;
        color: #374151;
    }
    input[type="file"]::file-selector-button {
        padding: 8px 14px;
        margin-right: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background-color: #eef2f7;
        color: #111827;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color .15s ease;
    }
    input[type="file"]::file-selector-button:hover {
        background-color: #e5e7eb;
    }

    .switch-container {
        display: flex;
        gap: 10px;
        width: 100%;
        max-width: 1280px;
        margin: 28px auto 0;
        padding: 0 16px;
        justify-content: center;
    }

    .switch-btn {
        height: 40px;
        padding: 0 18px;
        font-size: 14px;
        border: 1px solid #cbd5e1;
        border-radius: 999px;
        cursor: pointer;
        background-color: #eef2f7;
        color: #111827;
        font-weight: 700;
        transition: background-color .15s ease, color .15s ease, border-color .15s ease;
    }

        .switch-btn:hover:not(.active) {
            background-color: #e5e7eb;
        }

        .switch-btn.active {
            background-color: #111827;
            color: #fff;
            border-color: #111827;
        }

        .upload-layout{
        display: flex;
        gap: 24px;
        max-width: 1280px;
        margin: 20px auto 32px;
        padding: 18px;
        background: #fff;
        border: 1px solid #d8dee6;
        border-radius: 14px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }

    .upload-wrapper {
        display: flex;
        justify-content: space-between;
        gap: 40px;
        padding: 20px;
    }

    .upload-left {
        flex: 1;
    }

    .upload-right {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
    }

        .upload-right input,
        .upload-right textarea {
            width: 100%;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background-color: #fff;
            color: #1f2937;
        }

            .upload-right input[readonly],
            .upload-right textarea[readonly] {
                cursor: not-allowed;
                background-color: #f8fafc;
                color: #6b7280;
            }

    .upload-box {
        margin-bottom: 20px;
        padding: 14px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background-color: #f8fafc;
    }

        .upload-box label {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
        }

        .fileRow {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        .upload-box input[type="file"] {
            flex: 1;
            min-width: 0;
            margin-top: 0;
        }

       .fileClearBtn {
            flex-shrink: 0;
            width: 32px;
            height: 32px;
            padding: 0;
            font-size: 16px;
            line-height: 1;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            background-color: #e5e7eb;
            color: #111827;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fileClearBtn:hover {
            background-color: #fee2e2;
            color: #b42318;
        }

    .upload-btn {
        margin-top: 10px;
        height: 40px;
        padding: 0 16px;
        font-size: 14px;
        background-color: #111827;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 10px;
        font-weight: 700;
    }

        .upload-btn:hover {
            background-color: #1f2937;
        }
    .input-row {
        display: flex;
        flex-direction: row;
        gap: 10px; 
        margin-top: 10px;
    }

        .input-row input {
            flex: 1;
            padding: 8px 10px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
        }
    .form-group {
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px 12px;
            font-size: 14px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            background-color: #fff;
            color: #1f2937;
        }

    .form-row {
        margin-bottom: 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

        .form-row label {
            font-size: 13px;
            font-weight: 700;
            color: #374151;
        }

        .form-row input {
            padding: 8px 10px;
            font-size: 14px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
        }

        .form-row .hint {
            font-size: 12px;
            color: #6b7280;
        }

    @media (max-width: 980px) {
        .upload-layout { flex-direction: column; }
    }

    input[type="date"] {
        color: #9ca3af;
    }
</style>

</head>
<body>

    <!-- View Switch -->
    <div id="viewSwitch" class="switch-container">
        <button class="switch-btn active" data-mode="upload">Upload File</button>
        <button class="switch-btn" data-mode="manage">Manage Records</button>
    </div>

    <!-- Upload Form Section -->
    <div id="uploadSection">
        <div class="upload-layout">
            <!-- Left side: two upload sections -->
            <div class="upload-left">
                <div class="upload-box">
                    <label for="file1">Качване на условие:</label>
                    <div class="fileRow">
                        <input type="file" id="file1" name="fileA" />
                        <button type="button" id="fileClear1" class="fileClearBtn" title="Изчисти файла" aria-label="Изчисти избрания файл">×</button>
                    </div>
                </div>

                <div class="upload-box">
                    <label for="file2">Качване на решение:</label>
                    <div class="fileRow">
                        <input type="file" id="file2" name="fileB" />
                        <button type="button" id="fileClear2" class="fileClearBtn" title="Изчисти файла" aria-label="Изчисти избрания файл">×</button>
                    </div>
                </div>
                <br><br>
                <button id="uploadBtnB" class="upload-btn" style="width:100%">Напред</button>

            </div>

            <!-- Right side:  -->
            <div class="upload-right">
                <textarea id="name" rows="1" readonly placeholder="Име(съставно):" class="form-group"></textarea>
                <div>
                    <input type="text" id="Number" placeholder="Задача Номер" class="form-group" />
                    <input type="text" id="Page" placeholder="Страница" class="form-group" />
                    <select id="keywordDropdown" class="form-group">
                        <option disabled selected>Избери ресурс</option>
                    </select>
                    <div class="form-group">
                        <label for="classField">Клас:</label>
                        <input type="text" id="classField" placeholder="Enter class" />
                        <!-- <button id="uploadBtnA" class="uploadBtnA">Генерирай име</button> -->
                    </div>

                    <div class="form-group">
                        <label for="altText">URL за снимка на условието (алтернативен):</label>
                        <input type="text" id="altText" placeholder="URL for text" />
                    </div>

                    <div class="form-group">
                        <label for="altSolution">URL за снимка на решението (алтернативен):</label>
                        <input type="text" id="altSolution" placeholder="URL for solution" />
                    </div>

                    <div class="form-group">
                        <label for="difficulty">Трудност:</label>
                        <select id="difficulty">
                            <option value="1">1 - Лесно</option>
                            <option value="2">2 - Средно</option>
                            <option value="3">3 - Трудно</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="dateLastSolved">Последно решаван на:</label>
                        <input type="date" id="dateLastSolved" />
                    </div>

                    <div class="form-group">
                        <label for="dateForRevision">Дата за преговор:</label>
                        <input type="date" id="dateForRevision" />
                    </div>
                    <div class="form-group">
                        <label for="comments">Коментари:</label>
                        <textarea id="comments" placeholder="Добави коментар" rows="3"></textarea>
                    </div>
                    <div class="form-row">
                    <label for="ex_topic">Тема</label>
                    <input type="text" id="ex_topic" name="topic" placeholder="напр. Квадратни уравнения">
                    </div>

                    <div class="form-row">
                    <label for="ex_keywords">Ключови думи</label>
                    <input type="text" id="ex_keywords" name="keyWords" placeholder="напр. дискриминанта, Виет, квадратен трином">
                    <small class="hint">**Разделяй със запетаи.</small>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Manage Files Section -->
<div id="manageSection" style="display: none; width: 100%;">
    <iframe
        id="manageRecordsFrame"
        src="./exe_center_visualizer.html"
        title="Exercises Visualizer"
        style="
            display:block;
            width:100%;
            height:calc(100vh - 90px);
            min-height:760px;
            border:0;
            background:white;
        "
    ></iframe>
</div>
   <script>
  document.addEventListener('DOMContentLoaded', () => {
    const buttons = Array.from(
      document.querySelectorAll('#viewSwitch .switch-btn')
    );

    const uploadSection =
      document.getElementById('uploadSection');

    const manageSection =
      document.getElementById('manageSection');

    function setView(mode) {
      const showManage = mode === 'manage';

      uploadSection.style.display =
        showManage ? 'none' : 'block';

      manageSection.style.display =
        showManage ? 'block' : 'none';

      buttons.forEach(btn => {
        btn.classList.toggle(
          'active',
          btn.dataset.mode === mode
        );
      });
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        setView(btn.dataset.mode);
      });
    });

    setView('upload');
    const frame = document.getElementById('manageRecordsFrame');

if (frame) {
  frame.addEventListener('load', () => {
    try {
      frame.style.height = 'calc(100vh - 88px)';
    } catch (_) {}
  });
}
  });
</script>
    <script src="exe_solutions.js"></script>
    <script>
  window.YSN_KEY = 'exe_solutions';
</script>
<script src="/yellowStickyNotes.js"></script>
</body>

</html>
